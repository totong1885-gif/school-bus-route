<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFB800">
  <meta name="robots" content="noindex">
  <title>등하원 차량 · 서비스 종료</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #FFF8E6; --card: #fff; --text: #222; --muted: #666; --line: #E6D9B8; --brand: #FFB800; --danger: #C62828; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1a17; --card: #26241f; --text: #f2efe6; --muted: #aaa; --line: #4a4535; --danger: #ff8a80; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    header { background: var(--brand); color: #222; padding: 14px 16px; font-weight: 800; font-size: 20px; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 6px 0; }
    .muted { color: var(--muted); font-size: 15px; }
    button { width: 100%; min-height: 52px; margin-top: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 700; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: .5; }
    #msg { min-height: 1.6em; font-weight: 700; }
  </style>
</head>
<body>
  <header>🚌 등하원 차량</header>
  <main>
    <section class="card">
      <h1>서비스가 종료되었습니다</h1>
      <p>그동안 이용해 주셔서 감사합니다. 이 앱은 더 이상 운영하지 않습니다.</p>
      <p class="muted">이 휴대폰에 남아 있던 앱 파일(오프라인용)은 자동으로 지웠습니다.</p>
    </section>
    <section class="card" id="data-card" hidden>
      <h2>이 휴대폰에 남은 명단</h2>
      <p>아이 이름·주소 등 명단이 이 휴대폰에 아직 저장되어 있습니다.</p>
      <button id="export">명단 파일로 내려받기 (보관용)</button>
      <button class="danger" id="wipe">이 휴대폰에서 명단 모두 지우기</button>
      <p class="muted">지우면 되돌릴 수 없습니다. 필요하면 먼저 내려받아 두세요. 내려받은 파일에도 아이 이름·주소가 들어 있으니 보관에 주의하세요.</p>
    </section>
    <section class="card">
      <h2>홈 화면 아이콘 지우기</h2>
      <p class="muted">홈 화면에 추가했다면 아이콘을 길게 눌러 삭제(제거)하세요.</p>
    </section>
    <p id="msg" role="status" aria-live="polite"></p>
  </main>
  <script>
    // 남아 있는 서비스워커와 오프라인 캐시를 지운다(이전 버전 앱이 다시 뜨지 않게)
    (async () => {
      try {
        if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
        if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
      } catch (e) { console.warn(e); }
    })();

    const DB = 'busroute';
    const msg = (t) => { document.getElementById('msg').textContent = t; };
    function openDb() {
      return new Promise((resolve) => {
        try {
          const r = indexedDB.open(DB);
          r.onupgradeneeded = () => { r.transaction.abort(); resolve(null); }; // 없던 저장소는 만들지 않는다
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => resolve(null);
        } catch { resolve(null); }
      });
    }
    function all(db, store) {
      return new Promise((resolve) => {
        try {
          const q = db.transaction(store).objectStore(store).getAll();
          q.onsuccess = () => resolve(q.result || []);
          q.onerror = () => resolve([]);
        } catch { resolve([]); }
      });
    }
    (async () => {
      const db = await openDb();
      if (!db || !db.objectStoreNames.contains('children')) return;
      const kids = await all(db, 'children');
      db.close();
      if (!kids.length) return;
      document.getElementById('data-card').hidden = false;

      document.getElementById('export').addEventListener('click', async () => {
        const d = await openDb();
        if (!d) { msg('명단을 읽지 못했습니다'); return; }
        const kv = await all(d, 'kv');
        const settings = kv.find((x) => x.id === 'settings') || {};
        delete settings.kakaoRestKey; delete settings.kakaoJsKey;
        const data = { app: 'school-bus-route', version: 2, exportedAt: new Date().toISOString(), settings, children: await all(d, 'children'), courses: await all(d, 'courses') };
        d.close();
        const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url; a.download = `등하원명단-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        msg('명단 파일을 내려받았습니다');
      });

      document.getElementById('wipe').addEventListener('click', () => {
        if (!confirm('이 휴대폰에 저장된 명단·설정·기록을 모두 지울까요? 되돌릴 수 없습니다.')) return;
        const r = indexedDB.deleteDatabase(DB);
        r.onsuccess = () => { document.getElementById('data-card').hidden = true; msg('이 휴대폰의 명단을 모두 지웠습니다'); };
        r.onerror = () => msg('지우지 못했습니다. 브라우저 설정에서 사이트 데이터를 지워 주세요');
        r.onblocked = () => msg('다른 창에 앱이 열려 있습니다. 모두 닫고 다시 눌러 주세요');
      });
    })();
  </script>
</body>
</html>
